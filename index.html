<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServiçosMz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">ServiçosMz</div>
    <a href="#cadastro" class="btn-primary">Ofereça os seus serviços</a>
  </header>

  <section class="hero">
    <h1>Encontre os melhores profissionais perto de si</h1>
    <p>Eletricistas, canalizadores, mecânicos e muito mais em Moçambique.</p>
    
    <div class="search-box">
      <input type="text" id="search-service" placeholder="Que serviço procura? (ex: Eletricista)">
      <input type="text" id="search-location" placeholder="Cidade ou bairro (ex: Maputo, Matola)">
      <button id="btn-search" class="btn-search">Pesquisar</button>
    </div>
  </section>

  <main class="container">
    <h2>Profissionais Disponíveis</h2>
    <div id="lista-profissionais"></div>

    <section id="cadastro" class="card-cadastro">
      <h2>Cadastre-se como Prestador de Serviços</h2>
      <form id="form-cadastro">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Ex: João Manuel">
        </div>

        <div class="form-group">
          <label for="profissao">Profissão / Serviço</label>
          <input type="text" id="profissao" required placeholder="Ex: Eletricista">
        </div>

        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" required placeholder="Ex: Maputo">
        </div>

        <div class="form-group">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" required placeholder="Ex: KaMpfumu">
        </div>

        <div class="form-group">
          <label for="WhatsApp">Contacto WhatsApp</label>
          <input type="tel" id="WhatsApp" required placeholder="Ex: 841234567">
        </div>

        <button type="submit" class="btn-submit">Criar Perfil</button>
      </form>
    </section>
  </main>

  <!-- Ficheiros JavaScript carregados da raiz -->
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="register.js"></script>
</body>
</html>
