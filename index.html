<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServiçosMz</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
    .header { background-color: #0066cc; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: bold; }
    .btn-primary { background-color: #ffffff; color: #0066cc; padding: 8px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .hero { background: linear-gradient(135deg, #0066cc, #004080); color: #fff; padding: 40px 20px; text-align: center; }
    .search-box { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 20px auto 0 auto; }
    .search-box input { padding: 12px; border: none; border-radius: 5px; font-size: 15px; }
    .btn-search { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
    .card-cadastro { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 40px; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    .form-group label { font-weight: bold; margin-bottom: 5px; }
    .form-group input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
    .btn-submit { background-color: #0066cc; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">ServiçosMz</div>
    <a href="#cadastro" class="btn-primary">Ofereça os seus serviços</a>
  </header>

  <section class="hero">
    <h1>Encontre os melhores profissionais perto de si</h1>
    <p>Eletricistas, canalizadores, mecânicos e muito mais em Moçambique.</p>
    
    <div class="search-box">
      <input type="text" id="search-service" placeholder="Que serviço procura? (ex: Eletricista)">
      <input type="text" id="search-location" placeholder="Cidade ou bairro (ex: Maputo, Matola)">
      <button id="btn-search" class="btn-search">Pesquisar</button>
    </div>
  </section>

  <main class="container">
    <h2>Profissionais Disponíveis</h2>
    <div id="lista-profissionais"></div>

    <section id="cadastro" class="card-cadastro">
      <h2>Cadastre-se como Prestador de Serviços</h2>
      <form id="form-cadastro">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" required placeholder="Ex: João Manuel">
        </div>

        <div class="form-group">
          <label for="profissao">Profissão / Serviço</label>
          <input type="text" id="profissao" required placeholder="Ex: Eletricista">
        </div>

        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" required placeholder="Ex: Maputo">
        </div>

        <div class="form-group">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" required placeholder="Ex: KaMpfumu">
        </div>

        <div class="form-group">
          <label for="WhatsApp">Contacto WhatsApp</label>
          <input type="tel" id="WhatsApp" required placeholder="Ex: 841234567">
        </div>

        <button type="submit" class="btn-submit">Criar Perfil</button>
      </form>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="register.js"></script>
</body>
</html>
